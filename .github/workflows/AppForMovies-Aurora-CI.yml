# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      API: ./src/AppForMovies.API/AppForMovies.API.csproj
      WEB: ./src/AppForMovies.Web/AppForMovies.Web.csproj
      UT:  ./test/AppForMovies.UT/AppForMovies.UT.csproj
      UIT: ./test/AppForMovies.UIT/AppForMovies.UIT.csproj

    steps:
    - name: Check out repository code just branch development
      uses: actions/checkout@v4
      
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x
        
    - name: Restore dependencies
      run: |  
          dotnet restore ${{ env.API }} 
          dotnet restore ${{ env.WEB }}  
          dotnet restore ${{ env.UT }}  
          dotnet restore ${{ env.UIT }} 
          
    - name: Build
      run: |
          dotnet build ${{ env.API }}  --configuration Release --no-restore
          dotnet build ${{ env.WEB }}  --configuration Release --no-restore
          dotnet build ${{ env.UT }}  --configuration Release --no-restore
          dotnet build ${{ env.UIT }}  --configuration Release --no-restore
      
    - name: Run unit tests with report
      run: dotnet test ${{ env.UT }} --configuration Release --no-build --logger "trx;LogFileName=TestResults.trx"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: TestResults
        path: ./test/AppForMovies.UT/TestResults/TestResults.trx
